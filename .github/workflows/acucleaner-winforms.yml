name: AcuCleaner WinForms

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and publish Windows x64
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore AcuCleaner/AcuCleaner.csproj --runtime win-x64 -p:Configuration=Release -p:SelfContained=true

      - name: Build
        run: dotnet build AcuCleaner/AcuCleaner.csproj --configuration Release --runtime win-x64 --self-contained true --no-restore

      - name: Publish
        run: dotnet publish AcuCleaner/AcuCleaner.csproj --configuration Release --runtime win-x64 --self-contained true --no-build --no-restore --output artifacts/AcuCleaner-win-x64

      - name: Verify publish output
        run: |
          $publishDirectory = 'artifacts/AcuCleaner-win-x64'
          foreach ($file in @('AcuCleaner.exe', 'AcuCleaner.dll', 'AcuCleaner.deps.json', 'AcuCleaner.runtimeconfig.json', 'AcuCleaner.Services.dll', 'AcuCleaner.Models.dll', 'Microsoft.Data.SqlClient.dll', 'coreclr.dll', 'hostfxr.dll', 'System.Windows.Forms.dll')) {
            if (-not (Test-Path -LiteralPath (Join-Path $publishDirectory $file) -PathType Leaf)) {
              throw "Missing publish file: $file"
            }
          }

      - name: Upload Windows x64 application
        uses: actions/upload-artifact@v7.0.2
        with:
          name: AcuCleaner-win-x64
          path: artifacts/AcuCleaner-win-x64/
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true

  release:
    name: Release Windows x64
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Download published application
        uses: actions/download-artifact@v8.0.2
        with:
          name: AcuCleaner-win-x64
          path: artifacts/AcuCleaner-win-x64

      - name: Package complete application
        run: |
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            (Join-Path $PWD 'artifacts/AcuCleaner-win-x64'),
            (Join-Path $PWD 'AcuCleaner-win-x64.zip'))

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          $tag = "build-$env:RUN_NUMBER"
          $marker = "Workflow run: $env:RUN_URL"
          $asset = 'AcuCleaner-win-x64.zip'

          $refs = gh api "repos/$env:GH_REPO/git/matching-refs/tags/$tag" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Unable to look up release tag' }
          $tagRef = @($refs | Where-Object { $_.ref -eq "refs/tags/$tag" })
          if ($tagRef.Count -eq 0) {
            gh api --method POST "repos/$env:GH_REPO/git/refs" -f "ref=refs/tags/$tag" -f "sha=$env:RELEASE_SHA"
            if ($LASTEXITCODE -ne 0) { throw 'Unable to create release tag' }
          }

          $tagInfo = gh api "repos/$env:GH_REPO/git/ref/tags/$tag" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Unable to verify release tag' }
          $object = $tagInfo.object
          while ($object.type -eq 'tag') {
            $tagInfo = gh api "repos/$env:GH_REPO/git/tags/$($object.sha)" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'Unable to resolve annotated release tag' }
            $object = $tagInfo.object
          }
          if ($object.type -ne 'commit' -or $object.sha -ne $env:RELEASE_SHA) {
            throw "Tag $tag does not point to this workflow's commit; refusing to publish"
          }

          $releaseJson = gh release view $tag --json body,isDraft,isPrerelease 2>$null
          if ($LASTEXITCODE -eq 0) {
            $release = $releaseJson | ConvertFrom-Json
            if ($release.isDraft -or $release.isPrerelease -or
                ($release.body -split '\r?\n') -notcontains $marker) {
              throw "Release $tag is not this workflow run's published release; refusing to modify it"
            }
            gh release upload $tag $asset --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Unable to replace release asset' }
          } else {
            gh release create $tag $asset --verify-tag --target $env:RELEASE_SHA --title "AcuCleaner Windows x64 - build $env:RUN_NUMBER" --generate-notes --notes $marker
            if ($LASTEXITCODE -ne 0) { throw 'Unable to create release' }
          }
