name: AcuCleaner WinForms

on:
  push:
    branches: [master]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and publish Windows x64
    runs-on: windows-2025
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Compute version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if ($env:REF_TYPE -eq 'tag') {
            if ($env:REF_NAME -cnotmatch '^v((?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*))$') {
              throw "Tag '$env:REF_NAME' is not in vX.Y.Z format"
            }
            $version = $Matches[1]
          } else {
            $version = "0.0.$env:RUN_NUMBER"
          }
          $assemblyVersion = $null
          if (-not [version]::TryParse("$version.0", [ref]$assemblyVersion) -or
              $assemblyVersion.Major -gt 65534 -or $assemblyVersion.Minor -gt 65534 -or $assemblyVersion.Build -gt 65534) {
            throw "Version '$version' must have components between 0 and 65534"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version"

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore AcuCleaner/AcuCleaner.csproj --runtime win-x64 -p:Configuration=Release -p:SelfContained=true

      - name: Build
        run: dotnet build AcuCleaner/AcuCleaner.csproj --configuration Release --runtime win-x64 --self-contained true --no-restore -p:Version=${{ steps.version.outputs.version }} -p:AssemblyVersion=${{ steps.version.outputs.version }}.0 -p:FileVersion=${{ steps.version.outputs.version }}.0

      - name: Publish
        run: dotnet publish AcuCleaner/AcuCleaner.csproj --configuration Release --runtime win-x64 --self-contained true --no-build --no-restore --output artifacts/AcuCleaner-win-x64

      - name: Verify publish output
        run: |
          $publishDirectory = 'artifacts/AcuCleaner-win-x64'
          foreach ($file in @('AcuCleaner.exe', 'AcuCleaner.dll', 'AcuCleaner.deps.json', 'AcuCleaner.runtimeconfig.json', 'AcuCleaner.Services.dll', 'AcuCleaner.Models.dll', 'Microsoft.Data.SqlClient.dll', 'coreclr.dll', 'hostfxr.dll', 'System.Windows.Forms.dll')) {
            if (-not (Test-Path -LiteralPath (Join-Path $publishDirectory $file) -PathType Leaf)) {
              throw "Missing publish file: $file"
            }
          }

      - name: Upload Windows x64 application
        uses: actions/upload-artifact@v7.0.2
        with:
          name: AcuCleaner-win-x64
          path: artifacts/AcuCleaner-win-x64/
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true

  release:
    name: Release Windows x64
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Download published application
        uses: actions/download-artifact@v8.0.2
        with:
          name: AcuCleaner-win-x64
          path: artifacts/AcuCleaner-win-x64

      - name: Package complete application
        run: |
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            (Join-Path $PWD 'artifacts/AcuCleaner-win-x64'),
            (Join-Path $PWD 'AcuCleaner-win-x64.zip'))

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          $asset = 'AcuCleaner-win-x64.zip'

          $tagInfo = gh api "repos/$env:GH_REPO/git/ref/tags/$tag" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Unable to verify release tag' }
          $object = $tagInfo.object
          while ($object.type -eq 'tag') {
            $tagInfo = gh api "repos/$env:GH_REPO/git/tags/$($object.sha)" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'Unable to resolve annotated release tag' }
            $object = $tagInfo.object
          }
          if ($object.type -ne 'commit' -or $object.sha -ne $env:RELEASE_SHA) {
            throw "Tag $tag does not point to this workflow's commit; refusing to publish"
          }

          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --verify-tag --target $env:RELEASE_SHA --title "AcuCleaner $tag" --generate-notes
            if ($LASTEXITCODE -ne 0) {
              # The sibling workflow may have created the release concurrently.
              gh release view $tag *> $null
              if ($LASTEXITCODE -ne 0) { throw 'Unable to create release' }
            }
          }
          gh release upload $tag $asset --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Unable to upload release asset' }
