name: AcuCleaner VS Extension

on:
  push:
    branches: [master]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build VSIX
    runs-on: windows-2025
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Compute version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if ($env:REF_TYPE -eq 'tag') {
            if ($env:REF_NAME -cnotmatch '^v((?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*))$') {
              throw "Tag '$env:REF_NAME' is not in vX.Y.Z format"
            }
            $version = $Matches[1]
          } else {
            $version = "0.0.$env:RUN_NUMBER"
          }
          $assemblyVersion = $null
          if (-not [version]::TryParse("$version.0", [ref]$assemblyVersion) -or
              $assemblyVersion.Major -gt 65534 -or $assemblyVersion.Minor -gt 65534 -or $assemblyVersion.Build -gt 65534) {
            throw "Version '$version' must have components between 0 and 65534"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version"

      - name: Stamp VSIX manifest version
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $path = (Resolve-Path 'AcuCleanerVSExtension/source.extension.vsixmanifest').Path
          [xml]$xml = Get-Content -Raw $path
          $ns = [System.Xml.XmlNamespaceManager]::new($xml.NameTable)
          $ns.AddNamespace('v', 'http://schemas.microsoft.com/developer/vsx-schema/2011')
          $identity = $xml.SelectSingleNode('//v:Metadata/v:Identity', $ns)
          if (-not $identity) { throw 'Identity element not found in vsixmanifest' }
          $identity.SetAttribute('Version', $env:APP_VERSION)
          $xml.Save($path)

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Restore
        run: msbuild AcuCleanerVSExtension/AcuCleanerVSExtension.csproj -t:Restore -p:Configuration=Release

      - name: Build VSIX
        run: msbuild AcuCleanerVSExtension/AcuCleanerVSExtension.csproj -p:Configuration=Release -p:DeployExtension=false -m -p:Version=${{ steps.version.outputs.version }} -p:AssemblyVersion=${{ steps.version.outputs.version }}.0 -p:FileVersion=${{ steps.version.outputs.version }}.0

      - name: Collect and verify VSIX
        run: |
          $outputDirectory = 'artifacts/AcuCleaner-vsix'
          New-Item -ItemType Directory -Force -Path $outputDirectory | Out-Null
          $vsix = Get-ChildItem -Path 'AcuCleanerVSExtension/bin/Release' -Filter '*.vsix' -Recurse -File
          if (-not $vsix) { throw 'No .vsix file was produced' }
          $vsix | Copy-Item -Destination $outputDirectory
          Get-ChildItem $outputDirectory | Format-Table Name, Length

      - name: Upload VSIX
        uses: actions/upload-artifact@v7.0.2
        with:
          name: AcuCleaner-vsix
          path: artifacts/AcuCleaner-vsix/
          if-no-files-found: error
          overwrite: true

  release:
    name: Release VSIX
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Download VSIX
        uses: actions/download-artifact@v8.0.2
        with:
          name: AcuCleaner-vsix
          path: artifacts/AcuCleaner-vsix

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          $asset = (Get-ChildItem 'artifacts/AcuCleaner-vsix' -Filter '*.vsix' -File | Select-Object -First 1).FullName
          if (-not $asset) { throw 'VSIX asset not found' }

          $tagInfo = gh api "repos/$env:GH_REPO/git/ref/tags/$tag" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Unable to verify release tag' }
          $object = $tagInfo.object
          while ($object.type -eq 'tag') {
            $tagInfo = gh api "repos/$env:GH_REPO/git/tags/$($object.sha)" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'Unable to resolve annotated release tag' }
            $object = $tagInfo.object
          }
          if ($object.type -ne 'commit' -or $object.sha -ne $env:RELEASE_SHA) {
            throw "Tag $tag does not point to this workflow's commit; refusing to publish"
          }

          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --verify-tag --target $env:RELEASE_SHA --title "AcuCleaner $tag" --generate-notes
            if ($LASTEXITCODE -ne 0) {
              # The sibling workflow may have created the release concurrently.
              gh release view $tag *> $null
              if ($LASTEXITCODE -ne 0) { throw 'Unable to create release' }
            }
          }
          gh release upload $tag $asset --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Unable to upload release asset' }